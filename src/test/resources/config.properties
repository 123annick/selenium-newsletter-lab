# ---------------------------------------------------------------------------
# Default test settings. Any value can be overridden from the command line,
# e.g.  mvn test -Dheadless=false  or  mvn test -DbaseUrl=https://123annick.github.io/QAM-lab1/
# ---------------------------------------------------------------------------

# Page under test. Empty = the local copy in app/index.html
baseUrl=

# Only chrome is supported in this lab
browser=chrome

# Run Chrome without a window (always forced to true on CI)
headless=true

# Max seconds an explicit wait polls for a condition
explicitWaitSeconds=10
